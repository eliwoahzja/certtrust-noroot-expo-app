name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        run: echo "tag=v$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Generate native Android project
        run: npx expo prebuild --platform android

      - name: Build release APK (bundles JS, signed with debug keystore)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: certtrust-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CertTrust ${{ steps.version.outputs.tag }}"
          body: |
            ## CertTrust No-Root Certificate Manager
            **Version:** ${{ steps.version.outputs.tag }}

            ### What's New
            - Auto-update support: the app now checks for new releases on startup
            - Redesigned interactive dashboard
            - Sanitized error messages

            ### Install
            1. Download `app-release.apk` below
            2. Uninstall the old app first (signature may differ)
            3. Tap the APK to install (allow unknown sources)
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          draft: false
